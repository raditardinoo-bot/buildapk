name: Flutter APK Builder
run-name: "Flutter APK | ${{ inputs.tag }} | ${{ inputs.build_type }}"

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub Release asset URL untuk ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build dari bot"
        required: true
        type: string
      build_type:
        description: "Mode build APK"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          pub-cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Download project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["ZIP_URL"]
          u = urlparse(url)

          api_ok = (
              u.scheme == "https"
              and u.netloc == "api.github.com"
              and u.path.startswith("/repos/zhengliyoux/viabloodcurse/releases/assets/")
          )
          browser_ok = (
              u.scheme == "https"
              and u.netloc == "github.com"
              and u.path.startswith("/zhengliyoux/viabloodcurse/releases/download/")
          )

          if not (api_ok or browser_ok):
              raise SystemExit("zip_url ditolak: hanya asset release repo zhengliyoux/viabloodcurse yang diizinkan")
          PY

          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${ZIP_URL}" \
            --output project.zip

          test -s project.zip

      - name: Extract project safely
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archive = Path("project.zip").resolve()
          root = Path("source").resolve()
          root.mkdir(parents=True, exist_ok=True)

          max_uncompressed = 8 * 1024 * 1024 * 1024
          max_files = 100000

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if len(members) > max_files:
                  raise SystemExit("ZIP memiliki terlalu banyak file")

              total = sum(m.file_size for m in members)
              if total > max_uncompressed:
                  raise SystemExit("Ukuran hasil ekstrak ZIP melebihi 8 GB")

              for member in members:
                  target = (root / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Path ZIP tidak aman: {member.filename}")

              zf.extractall(root)

          pubspecs = [
              p for p in root.rglob("pubspec.yaml")
              if ".dart_tool" not in p.parts and "build" not in p.parts
          ]

          if not pubspecs:
              raise SystemExit("pubspec.yaml tidak ditemukan di dalam ZIP")

          pubspecs.sort(key=lambda p: (len(p.relative_to(root).parts), str(p)))
          project_dir = pubspecs[0].parent.resolve()

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PROJECT_DIR={project_dir}\n")

          print(f"Project Flutter: {project_dir}")
          PY

      - name: Prepare Flutter project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter --version

          if [ ! -d android ]; then
            echo "Folder android tidak ada, membuat platform Android..."
            flutter create --platforms=android .
          fi

          flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --no-pub
          else
            flutter build apk --release --no-pub
          fi

      - name: Prepare APK artifact
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK="build/app/outputs/flutter-apk/app-debug.apk"
          else
            APK="build/app/outputs/flutter-apk/app-release.apk"
          fi

          if [ ! -f "$APK" ]; then
            APK="$(find build/app/outputs -type f -name '*.apk' | head -n 1 || true)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan setelah build."
            find build/app/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          SAFE_TAG="$(printf '%s' "$BUILD_TAG" | tr -c 'A-Za-z0-9._-' '_')"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$APK" "$GITHUB_WORKSPACE/artifact/${SAFE_TAG}-${BUILD_TYPE}.apk"

          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
