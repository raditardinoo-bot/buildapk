name: Flutter APK Builder
run-name: "Flutter APK | ${{ inputs.tag }} | ${{ inputs.build_type }}"

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub Release asset URL untuk ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build dari bot"
        required: true
        type: string
      build_type:
        description: "Mode build APK"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.BUILDAPK_PAT || github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["ZIP_URL"]
          u = urlparse(url)

          api_ok = (
              u.scheme == "https"
              and u.netloc == "api.github.com"
              and u.path.startswith("/repos/raditardinoo-bot/buildapk/releases/assets/")
          )
          browser_ok = (
              u.scheme == "https"
              and u.netloc == "github.com"
              and u.path.startswith("/raditardinoo-bot/buildapk/releases/download/")
          )

          if not (api_ok or browser_ok):
              raise SystemExit(
                  "zip_url ditolak: hanya asset release repo "
                  "raditardinoo-bot/buildapk yang diizinkan"
              )
          PY

          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${ZIP_URL}" \
            --output project.zip

          test -s project.zip

      - name: Extract project safely
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path("project.zip").resolve()
          root = Path("source").resolve()
          root.mkdir(parents=True, exist_ok=True)

          max_uncompressed = 8 * 1024 * 1024 * 1024
          max_files = 100000

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if len(members) > max_files:
                  raise SystemExit("ZIP memiliki terlalu banyak file")

              total = sum(m.file_size for m in members)
              if total > max_uncompressed:
                  raise SystemExit("Ukuran hasil ekstrak ZIP melebihi 8 GB")

              for member in members:
                  target = (root / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Path ZIP tidak aman: {member.filename}")

              zf.extractall(root)

          pubspecs = [
              p for p in root.rglob("pubspec.yaml")
              if ".dart_tool" not in p.parts and "build" not in p.parts
          ]
          if not pubspecs:
              raise SystemExit("pubspec.yaml tidak ditemukan di dalam ZIP")

          pubspecs.sort(key=lambda p: (len(p.relative_to(root).parts), str(p)))
          project_dir = pubspecs[0].parent.resolve()

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PROJECT_DIR={project_dir}\n")

          print(f"Project Flutter: {project_dir}")
          PY

      - name: Select compatible Flutter SDK
        id: flutter_sdk
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("pubspec.yaml").read_text(encoding="utf-8", errors="ignore")

          # Flutter 3.44 made IconData final. font_awesome_flutter 10.x extends
          # IconData, so legacy projects using it compile cleanly on Flutter 3.41.x.
          fa = re.search(
              r'(?m)^\s*font_awesome_flutter\s*:\s*["\']?([^#\n"\']+)', text
          )
          fa_major = None
          if fa:
              vm = re.search(r'(\d+)\.(\d+)\.(\d+)', fa.group(1))
              if vm:
                  fa_major = int(vm.group(1))

          # Flutter 3.41.9 ships Dart 3.11.5. If the project explicitly requires
          # Dart 3.12+ or Flutter 3.44+, keep the current Flutter line instead.
          dart_min = None
          sdk = re.search(
              r'(?ms)^environment\s*:\s*\n(?:[ \t]+.*\n)*?[ \t]+sdk\s*:\s*["\']?([^\n"\']+)',
              text,
          )
          if sdk:
              vm = re.search(r'>=\s*(\d+)\.(\d+)', sdk.group(1))
              if not vm:
                  vm = re.search(r'\^\s*(\d+)\.(\d+)', sdk.group(1))
              if vm:
                  dart_min = (int(vm.group(1)), int(vm.group(2)))

          flutter_min = None
          fm = re.search(
              r'(?ms)^environment\s*:\s*\n(?:[ \t]+.*\n)*?[ \t]+flutter\s*:\s*["\']?([^\n"\']+)',
              text,
          )
          if fm:
              vm = re.search(r'>=\s*(\d+)\.(\d+)', fm.group(1))
              if vm:
                  flutter_min = (int(vm.group(1)), int(vm.group(2)))

          needs_new_dart = dart_min is not None and dart_min >= (3, 12)
          needs_new_flutter = flutter_min is not None and flutter_min >= (3, 44)

          if fa_major is not None and fa_major < 11 and not needs_new_dart and not needs_new_flutter:
              version = "3.41.9"
              mode = "legacy-fa10"
              reason = (
                  "font_awesome_flutter 10.x detected; using Flutter 3.41.9 "
                  "before IconData became final"
              )
          else:
              version = "3.47.2"
              mode = "modern"
              reason = "using current Flutter 3.47.2 compatibility line"

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"mode={mode}\n")

          print(f"font_awesome_flutter major: {fa_major or 'not detected'}")
          print(f"Dart minimum: {dart_min or 'not detected'}")
          print(f"Flutter minimum: {flutter_min or 'not detected'}")
          print(f"Selected Flutter: {version}")
          print(f"Reason: {reason}")
          PY

      - name: Setup Flutter ${{ steps.flutter_sdk.outputs.version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_sdk.outputs.version }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Prepare Flutter project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter --version

          if [ ! -d android ]; then
            echo "Folder android tidak ada, membuat platform Android..."
            flutter create --platforms=android .
          fi

      - name: Patch source compatibility
        env:
          FLUTTER_MODE: ${{ steps.flutter_sdk.outputs.mode }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          text = pubspec.read_text(encoding="utf-8")
          dart_files = list(Path("lib").rglob("*.dart")) if Path("lib").exists() else []

          # Repair source that calls http.post/http.get/etc. without importing
          # package:http with the alias expected by those calls.
          http_users = []
          for dart in dart_files:
              src = dart.read_text(encoding="utf-8", errors="ignore")
              if not re.search(r'\bhttp\s*\.', src):
                  continue

              http_users.append(str(dart))
              aliased = re.search(
                  r'import\s+["\']package:http/http\.dart["\']\s+as\s+http\s*;',
                  src,
              )
              if aliased:
                  continue

              bare = re.compile(r'import\s+(["\'])package:http/http\.dart\1\s*;')
              if bare.search(src):
                  src = bare.sub("import 'package:http/http.dart' as http;", src, count=1)
              else:
                  first_import = re.search(r'(?m)^import\s+', src)
                  if first_import:
                      pos = first_import.start()
                      src = src[:pos] + "import 'package:http/http.dart' as http;\n" + src[pos:]
                  else:
                      src = "import 'package:http/http.dart' as http;\n" + src

              dart.write_text(src, encoding="utf-8")
              print(f"Fixed package:http alias import: {dart}")

          if http_users and not re.search(r'(?m)^  http\s*:', text):
              if not re.search(r'(?m)^dependencies\s*:\s*$', text):
                  raise SystemExit("dependencies: section not found in pubspec.yaml")
              text = re.sub(
                  r'(?m)^dependencies\s*:\s*$',
                  'dependencies:\n  http: ^1.6.0',
                  text,
                  count=1,
              )
              print("Added direct dependency: http ^1.6.0")

          # Only modern Flutter needs the Font Awesome 11 migration. Legacy
          # FA10 projects are intentionally kept unchanged and built by 3.41.9.
          if os.environ.get("FLUTTER_MODE") == "modern":
              fa_line = re.compile(
                  r'(?m)^(\s*font_awesome_flutter\s*:\s*)(["\']?)([^#\n"\']+)(["\']?)(\s*(?:#.*)?)$'
              )
              changed = False

              def bump_fa(m):
                  nonlocal_marker = None
                  raw = m.group(3).strip()
                  vm = re.search(r'(\d+)\.(\d+)\.(\d+)', raw)
                  if vm and int(vm.group(1)) < 11:
                      return f'{m.group(1)}^11.0.0{m.group(5)}'
                  return m.group(0)

              new_text = fa_line.sub(bump_fa, text)
              if new_text != text:
                  changed = True
                  text = new_text
                  print("Modern mode: font_awesome_flutter upgraded to ^11.0.0")

              if changed:
                  # Direct standard Icon(FontAwesomeIcons.foo) calls must become FaIcon.
                  icon_ctor = re.compile(
                      r'\bIcon(?=\s*\(\s*FontAwesomeIcons\.[A-Za-z0-9_]+)'
                  )
                  for dart in dart_files:
                      src = dart.read_text(encoding="utf-8", errors="ignore")
                      out, count = icon_ctor.subn("FaIcon", src)
                      if count:
                          dart.write_text(out, encoding="utf-8")
                          print(f"Migrated {count} direct FontAwesome Icon call(s): {dart}")

          pubspec.write_text(text, encoding="utf-8")
          print(f"http user files: {len(http_users)}")
          PY

          # flutter clean deletes .dart_tool, so it must happen BEFORE pub get.
          flutter clean

      - name: Fix Android toolchain for modern Flutter
        if: steps.flutter_sdk.outputs.mode == 'modern'
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import re
          from pathlib import Path

          android = Path("android")
          wrapper = android / "gradle/wrapper/gradle-wrapper.properties"
          props = android / "gradle.properties"

          if not wrapper.exists():
              raise SystemExit("gradle-wrapper.properties tidak ditemukan")

          MIN_AGP = "8.11.1"
          MIN_KOTLIN = "2.2.20"
          MIN_GRADLE = "8.14.3"

          def ver(v):
              parts = [int(x) for x in v.split(".")]
              return tuple((parts + [0, 0, 0, 0])[:4])

          gradle_files = [
              android / "settings.gradle",
              android / "settings.gradle.kts",
              android / "build.gradle",
              android / "build.gradle.kts",
          ]

          agp_patterns = [
              re.compile(
                  r'(id\s*\(\s*["\']com\.android\.(?:application|library)["\']\s*\)'
                  r'\s*version\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s+["\']com\.android\.(?:application|library)["\']'
                  r'\s+version\s+["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
          ]
          agp_classpath = re.compile(
              r'(com\.android\.tools\.build:gradle:)([0-9]+(?:\.[0-9]+){1,3})'
          )

          kotlin_patterns = [
              re.compile(
                  r'(id\s*\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)'
                  r'\s*version\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']'
                  r'\s+version\s+["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s*\(\s*["\']kotlin-android["\']\s*\)'
                  r'\s*version\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s+["\']kotlin-android["\']'
                  r'\s+version\s+["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
          ]
          kotlin_ext = re.compile(
              r'((?:ext\.)?kotlin_version\s*=\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
          )
          kotlin_classpath = re.compile(
              r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)([0-9]+(?:\.[0-9]+){1,3})'
          )

          def patch_versions(patterns, classpath_rx, minimum, label, extra_rx=None):
              detected = []
              for f in gradle_files:
                  if not f.exists():
                      continue
                  src = f.read_text(encoding="utf-8", errors="ignore")
                  for rx in patterns:
                      detected.extend(m.group(2) for m in rx.finditer(src))
                  detected.extend(m.group(2) for m in classpath_rx.finditer(src))
                  if extra_rx:
                      detected.extend(m.group(2) for m in extra_rx.finditer(src))

              current = max(detected, key=ver) if detected else None
              print(f"Detected {label}: {current or 'unknown'}")
              if not current or ver(current) >= ver(minimum):
                  return current

              def bump3(m):
                  return m.group(1) + minimum + m.group(3)

              def bump2(m):
                  return m.group(1) + minimum

              changed = []
              for f in gradle_files:
                  if not f.exists():
                      continue
                  src = f.read_text(encoding="utf-8", errors="ignore")
                  out = src
                  for rx in patterns:
                      out = rx.sub(bump3, out)
                  out = classpath_rx.sub(bump2, out)
                  if extra_rx:
                      out = extra_rx.sub(bump3, out)
                  if out != src:
                      f.write_text(out, encoding="utf-8")
                      changed.append(str(f))

              if not changed:
                  raise SystemExit(f"{label} {current} terdeteksi tetapi gagal dipatch")
              print(f"{label} upgraded: {current} -> {minimum}")
              return minimum

          agp = patch_versions(agp_patterns, agp_classpath, MIN_AGP, "AGP")
          kotlin = patch_versions(
              kotlin_patterns, kotlin_classpath, MIN_KOTLIN, "Kotlin", kotlin_ext
          )

          wrapper_text = wrapper.read_text(encoding="utf-8")
          m = re.search(r'gradle-([0-9]+(?:\.[0-9]+){1,3})-(bin|all)\.zip', wrapper_text)
          if not m:
              raise SystemExit("Versi Gradle tidak dapat dibaca")

          current_gradle = m.group(1)
          package_kind = m.group(2)
          if ver(current_gradle) < ver(MIN_GRADLE):
              wrapper_text = re.sub(
                  r'gradle-[0-9]+(?:\.[0-9]+){1,3}-(?:bin|all)\.zip',
                  f'gradle-{MIN_GRADLE}-{package_kind}.zip',
                  wrapper_text,
                  count=1,
              )
              wrapper.write_text(wrapper_text, encoding="utf-8")
              print(f"Gradle upgraded: {current_gradle} -> {MIN_GRADLE}")
          else:
              print(f"Gradle already compatible: {current_gradle}")
          PY

      - name: Keep uploaded Android toolchain for legacy Flutter
        if: steps.flutter_sdk.outputs.mode == 'legacy-fa10'
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "Legacy Font Awesome mode: preserving project's Gradle/AGP/Kotlin versions."
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties || true
          grep -R -n -E 'com\.android\.(application|library).*version|com\.android\.tools\.build:gradle:|org\.jetbrains\.kotlin\.android.*version|kotlin_version' \
            android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts \
            2>/dev/null || true

      - name: Resolve Flutter dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter pub get

          if [ ! -s .dart_tool/package_config.json ]; then
            echo "ERROR: .dart_tool/package_config.json tidak dibuat oleh flutter pub get"
            ls -la .dart_tool 2>/dev/null || true
            exit 1
          fi

          echo "package_config.json ready:"
          ls -lh .dart_tool/package_config.json

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --no-pub
          else
            flutter build apk --release --no-pub
          fi

      - name: Prepare APK artifact
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK="build/app/outputs/flutter-apk/app-debug.apk"
          else
            APK="build/app/outputs/flutter-apk/app-release.apk"
          fi

          if [ ! -f "$APK" ]; then
            APK="$(find build/app/outputs -type f -name '*.apk' | head -n 1 || true)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan setelah build."
            find build/app/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          SAFE_TAG="$(printf '%s' "$BUILD_TAG" | tr -c 'A-Za-z0-9._-' '_')"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$APK" "$GITHUB_WORKSPACE/artifact/${SAFE_TAG}-${BUILD_TYPE}.apk"
          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
