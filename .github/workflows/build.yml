name: Flutter APK Builder
run-name: "Flutter APK | ${{ inputs.tag }} | ${{ inputs.build_type }}"

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub Release asset URL untuk ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build dari bot"
        required: true
        type: string
      build_type:
        description: "Mode build APK"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  # Draft release assets require push-level access.
  # contents: write also includes read access.
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          pub-cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Download project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.BUILDAPK_PAT || github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["ZIP_URL"]
          u = urlparse(url)

          api_ok = (
              u.scheme == "https"
              and u.netloc == "api.github.com"
              and u.path.startswith("/repos/raditardinoo-bot/buildapk/releases/assets/")
          )
          browser_ok = (
              u.scheme == "https"
              and u.netloc == "github.com"
              and u.path.startswith("/raditardinoo-bot/buildapk/releases/download/")
          )

          if not (api_ok or browser_ok):
              raise SystemExit("zip_url ditolak: hanya asset release repo raditardinoo-bot/buildapk yang diizinkan")
          PY

          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${ZIP_URL}" \
            --output project.zip

          test -s project.zip

      - name: Extract project safely
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archive = Path("project.zip").resolve()
          root = Path("source").resolve()
          root.mkdir(parents=True, exist_ok=True)

          max_uncompressed = 8 * 1024 * 1024 * 1024
          max_files = 100000

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if len(members) > max_files:
                  raise SystemExit("ZIP memiliki terlalu banyak file")

              total = sum(m.file_size for m in members)
              if total > max_uncompressed:
                  raise SystemExit("Ukuran hasil ekstrak ZIP melebihi 8 GB")

              for member in members:
                  target = (root / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Path ZIP tidak aman: {member.filename}")

              zf.extractall(root)

          pubspecs = [
              p for p in root.rglob("pubspec.yaml")
              if ".dart_tool" not in p.parts and "build" not in p.parts
          ]

          if not pubspecs:
              raise SystemExit("pubspec.yaml tidak ditemukan di dalam ZIP")

          pubspecs.sort(key=lambda p: (len(p.relative_to(root).parts), str(p)))
          project_dir = pubspecs[0].parent.resolve()

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PROJECT_DIR={project_dir}\n")

          print(f"Project Flutter: {project_dir}")
          PY

      - name: Prepare Flutter project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter --version

          if [ ! -d android ]; then
            echo "Folder android tidak ada, membuat platform Android..."
            flutter create --platforms=android .
          fi

          flutter pub get

      - name: Fix Android build toolchain compatibility
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import re
          from pathlib import Path

          android = Path("android")
          wrapper = android / "gradle/wrapper/gradle-wrapper.properties"
          props = android / "gradle.properties"

          if not wrapper.exists():
              raise SystemExit("gradle-wrapper.properties tidak ditemukan")

          MIN_AGP = "8.11.1"
          MIN_KOTLIN = "2.2.20"
          MIN_GRADLE_FLUTTER = "8.14.3"
          MIN_GRADLE_AGP9 = "9.1.0"

          def ver(v):
              parts = [int(x) for x in v.split(".")]
              return tuple((parts + [0, 0, 0, 0])[:4])

          gradle_files = [
              android / "settings.gradle",
              android / "settings.gradle.kts",
              android / "build.gradle",
              android / "build.gradle.kts",
          ]

          # Flutter modern templates put AGP in settings.gradle(.kts).
          plugin_patterns = [
              re.compile(
                  r'(id\s*\(\s*["\']com\.android\.(?:application|library)["\']\s*\)'
                  r'\s*version\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s+["\']com\.android\.(?:application|library)["\']'
                  r'\s+version\s+["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
          ]

          # Older Flutter templates put AGP on the buildscript classpath.
          classpath_pattern = re.compile(
              r'(com\.android\.tools\.build:gradle:)([0-9]+(?:\.[0-9]+){1,3})'
          )

          detected_agp = []
          for f in gradle_files:
              if not f.exists():
                  continue
              src = f.read_text(encoding="utf-8", errors="ignore")
              for rx in plugin_patterns:
                  detected_agp.extend(m.group(2) for m in rx.finditer(src))
              detected_agp.extend(m.group(2) for m in classpath_pattern.finditer(src))

          agp = max(detected_agp, key=ver) if detected_agp else None
          print(f"Detected AGP before patch: {agp or 'unknown'}")

          # Keep AGP 8.x on the legacy DSL, but raise versions Flutter 3.47 rejects.
          # Do not force AGP 9 because that introduces the new DSL migration.
          if agp and ver(agp) < ver(MIN_AGP):
              changed = []

              def bump_plugin(match):
                  old = match.group(2)
                  if ver(old) < ver(MIN_AGP):
                      return match.group(1) + MIN_AGP + match.group(3)
                  return match.group(0)

              def bump_classpath(match):
                  old = match.group(2)
                  if ver(old) < ver(MIN_AGP):
                      return match.group(1) + MIN_AGP
                  return match.group(0)

              for f in gradle_files:
                  if not f.exists():
                      continue
                  src = f.read_text(encoding="utf-8", errors="ignore")
                  out = src
                  for rx in plugin_patterns:
                      out = rx.sub(bump_plugin, out)
                  out = classpath_pattern.sub(bump_classpath, out)
                  if out != src:
                      f.write_text(out, encoding="utf-8")
                      changed.append(str(f))

              if not changed:
                  raise SystemExit(
                      f"AGP {agp} terdeteksi tetapi lokasi versinya tidak berhasil dipatch"
                  )

              print(f"AGP upgraded: {agp} -> {MIN_AGP}")
              print("Patched files:", ", ".join(changed))
              agp = MIN_AGP
          elif agp:
              print(f"AGP sudah memenuhi requirement: {agp}")
          else:
              print("WARNING: versi AGP tidak ditemukan; workflow tidak mengubah AGP")

          # Flutter 3.47 also validates the Kotlin Gradle Plugin (KGP).
          # Support both current Flutter plugin declarations and older templates.
          kotlin_plugin_patterns = [
              re.compile(
                  r'(id\s*\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)'
                  r'\s*version\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']'
                  r'\s+version\s+["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s*\(\s*["\']kotlin-android["\']\s*\)'
                  r'\s*version\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
              re.compile(
                  r'(id\s+["\']kotlin-android["\']'
                  r'\s+version\s+["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
              ),
          ]
          kotlin_ext_pattern = re.compile(
              r'((?:ext\.)?kotlin_version\s*=\s*["\'])([0-9]+(?:\.[0-9]+){1,3})(["\'])'
          )
          kotlin_classpath_literal = re.compile(
              r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)([0-9]+(?:\.[0-9]+){1,3})'
          )

          detected_kotlin = []
          for f in gradle_files:
              if not f.exists():
                  continue
              src = f.read_text(encoding="utf-8", errors="ignore")
              for rx in kotlin_plugin_patterns:
                  detected_kotlin.extend(m.group(2) for m in rx.finditer(src))
              detected_kotlin.extend(m.group(2) for m in kotlin_ext_pattern.finditer(src))
              detected_kotlin.extend(m.group(2) for m in kotlin_classpath_literal.finditer(src))

          kotlin = max(detected_kotlin, key=ver) if detected_kotlin else None
          print(f"Detected Kotlin before patch: {kotlin or 'unknown'}")

          if kotlin and ver(kotlin) < ver(MIN_KOTLIN):
              changed = []

              def bump_kotlin(match):
                  old = match.group(2)
                  if ver(old) < ver(MIN_KOTLIN):
                      return match.group(1) + MIN_KOTLIN + match.group(3)
                  return match.group(0)

              def bump_kotlin_classpath(match):
                  old = match.group(2)
                  if ver(old) < ver(MIN_KOTLIN):
                      return match.group(1) + MIN_KOTLIN
                  return match.group(0)

              for f in gradle_files:
                  if not f.exists():
                      continue
                  src = f.read_text(encoding="utf-8", errors="ignore")
                  out = src
                  for rx in kotlin_plugin_patterns:
                      out = rx.sub(bump_kotlin, out)
                  out = kotlin_ext_pattern.sub(bump_kotlin, out)
                  out = kotlin_classpath_literal.sub(bump_kotlin_classpath, out)
                  if out != src:
                      f.write_text(out, encoding="utf-8")
                      changed.append(str(f))

              if not changed:
                  raise SystemExit(
                      f"Kotlin {kotlin} terdeteksi tetapi lokasi versinya tidak berhasil dipatch"
                  )

              print(f"Kotlin upgraded: {kotlin} -> {MIN_KOTLIN}")
              print("Kotlin patched files:", ", ".join(changed))
              kotlin = MIN_KOTLIN
          elif kotlin:
              print(f"Kotlin sudah memenuhi requirement: {kotlin}")
          else:
              print("WARNING: versi Kotlin tidak ditemukan; workflow tidak mengubah Kotlin")

          wrapper_text = wrapper.read_text(encoding="utf-8")
          m = re.search(
              r"gradle-([0-9]+(?:\.[0-9]+){1,3})-(bin|all)\.zip",
              wrapper_text,
          )
          if not m:
              raise SystemExit("Versi Gradle tidak dapat dibaca dari gradle-wrapper.properties")

          current_gradle = m.group(1)
          package_kind = m.group(2)
          required_gradle = (
              MIN_GRADLE_AGP9
              if agp and ver(agp) >= ver("9.0.0")
              else MIN_GRADLE_FLUTTER
          )

          print(f"Current Gradle: {current_gradle}")
          print(f"Required Gradle: {required_gradle}")

          if ver(current_gradle) < ver(required_gradle):
              wrapper_text = re.sub(
                  r"gradle-[0-9]+(?:\.[0-9]+){1,3}-(?:bin|all)\.zip",
                  f"gradle-{required_gradle}-{package_kind}.zip",
                  wrapper_text,
                  count=1,
              )
              wrapper.write_text(wrapper_text, encoding="utf-8")
              print(f"Gradle wrapper upgraded: {current_gradle} -> {required_gradle}")
          else:
              print("Gradle wrapper sudah memenuhi requirement")

          # Only needed if an uploaded project is already on AGP 9+.
          if agp and ver(agp) >= ver("9.0.0"):
              prop_text = props.read_text(encoding="utf-8") if props.exists() else ""

              def set_prop(src, key, value):
                  line = f"{key}={value}"
                  rx = re.compile(rf"(?m)^\s*{re.escape(key)}\s*=.*$")
                  if rx.search(src):
                      return rx.sub(line, src)
                  if src and not src.endswith("\n"):
                      src += "\n"
                  return src + line + "\n"

              prop_text = set_prop(prop_text, "android.newDsl", "false")
              props.write_text(prop_text, encoding="utf-8")
              print("AGP 9 compatibility: android.newDsl=false")
          PY

          echo "--- AGP declarations ---"
          grep -R -n -E 'com\.android\.(application|library).*version|com\.android\.tools\.build:gradle:' \
            android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts \
            2>/dev/null || true

          echo "--- Kotlin declarations ---"
          grep -R -n -E 'org\.jetbrains\.kotlin\.android.*version|kotlin-android.*version|kotlin_version|org\.jetbrains\.kotlin:kotlin-gradle-plugin:' \
            android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts \
            2>/dev/null || true

          echo "--- gradle-wrapper.properties ---"
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

          echo "--- compatibility properties ---"
          grep -E '^android\.(newDsl|builtInKotlin)=' android/gradle.properties 2>/dev/null || true

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --no-pub
          else
            flutter build apk --release --no-pub
          fi

      - name: Prepare APK artifact
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK="build/app/outputs/flutter-apk/app-debug.apk"
          else
            APK="build/app/outputs/flutter-apk/app-release.apk"
          fi

          if [ ! -f "$APK" ]; then
            APK="$(find build/app/outputs -type f -name '*.apk' | head -n 1 || true)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan setelah build."
            find build/app/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          SAFE_TAG="$(printf '%s' "$BUILD_TAG" | tr -c 'A-Za-z0-9._-' '_')"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$APK" "$GITHUB_WORKSPACE/artifact/${SAFE_TAG}-${BUILD_TYPE}.apk"

          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
