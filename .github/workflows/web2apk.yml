name: Web To APK Builder
run-name: "Web2APK | ${{ inputs.app_name }}"

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website yang akan dibungkus menjadi APK"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        type: string
      icon_url:
        description: "URL icon dari GitHub Release"
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  web-to-apk:
    name: Build WebView APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          pub-cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Validate website URL
        env:
          WEB_URL: ${{ inputs.web_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["WEB_URL"]
          u = urlparse(url)
          if u.scheme not in ("http", "https") or not u.netloc:
              raise SystemExit("web_url harus berupa URL http:// atau https:// yang valid")
          PY

      - name: Create Flutter WebView project
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android \
            --org=com.web2apk \
            --project-name=web2apk \
            web2apk

          cd web2apk
          flutter pub add webview_flutter
          flutter pub add --dev flutter_launcher_icons

      - name: Create WebView application
        run: |
          set -euo pipefail

          cat > web2apk/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String webUrl = String.fromEnvironment(
            'WEB_URL',
            defaultValue: 'https://example.com',
          );

          const String appName = String.fromEnvironment(
            'APP_NAME',
            defaultValue: 'Web App',
          );

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebToApkApp());
          }

          class WebToApkApp extends StatelessWidget {
            const WebToApkApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: appName,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true),
                home: const WebPage(),
              );
            }
          }

          class WebPage extends StatefulWidget {
            const WebPage({super.key});

            @override
            State<WebPage> createState() => _WebPageState();
          }

          class _WebPageState extends State<WebPage> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFFFFFFFF))
                ..loadRequest(Uri.parse(webUrl));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: controller),
                ),
              );
            }
          }
          DART

      - name: Configure Android manifest
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("web2apk/android/app/src/main/AndroidManifest.xml")
          ns = "http://schemas.android.com/apk/res/android"
          a = f"{{{ns}}}"
          ET.register_namespace("android", ns)

          tree = ET.parse(manifest)
          root = tree.getroot()

          permissions = {
              node.get(a + "name")
              for node in root.findall("uses-permission")
          }

          if "android.permission.INTERNET" not in permissions:
              node = ET.Element("uses-permission")
              node.set(a + "name", "android.permission.INTERNET")
              root.insert(0, node)

          app = root.find("application")
          if app is None:
              raise SystemExit("Elemen <application> tidak ditemukan")

          app.set(a + "label", os.environ["APP_NAME"])
          app.set(a + "usesCleartextTraffic", "true")

          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY

      - name: Download and apply launcher icon
        env:
          ICON_URL: ${{ inputs.icon_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["ICON_URL"]
          u = urlparse(url)

          api_ok = (
              u.scheme == "https"
              and u.netloc == "api.github.com"
              and u.path.startswith("/repos/zhengliyoux/viabloodcurse/releases/assets/")
          )
          browser_ok = (
              u.scheme == "https"
              and u.netloc == "github.com"
              and u.path.startswith("/zhengliyoux/viabloodcurse/releases/download/")
          )

          if not (api_ok or browser_ok):
              raise SystemExit("icon_url ditolak: hanya asset release repo zhengliyoux/viabloodcurse yang diizinkan")
          PY

          mkdir -p web2apk/assets

          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${ICON_URL}" \
            --output web2apk/assets/icon.png

          test -s web2apk/assets/icon.png

          cat > web2apk/flutter_launcher_icons.yaml <<'ICONCFG'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/icon.png
            min_sdk_android: 21
          ICONCFG

          cd web2apk
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build release APK
        env:
          WEB_URL: ${{ inputs.web_url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          cd web2apk

          flutter pub get
          flutter build apk --release --no-pub \
            --dart-define=WEB_URL="$WEB_URL" \
            --dart-define=APP_NAME="$APP_NAME"

      - name: Prepare APK artifact
        run: |
          set -euo pipefail

          APK="web2apk/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find web2apk/build/app/outputs -type f -name '*.apk' | head -n 1 || true)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "APK Web2APK tidak ditemukan."
            find web2apk/build/app/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p artifact
          cp "$APK" artifact/web2apk-release.apk
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-web2apk-${{ github.run_id }}
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
